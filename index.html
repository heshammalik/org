<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesham Malik | Sovereign Spatial Codex</title>
    
    <!-- Three.js & OrbitControls via CDN for zero-build GitHub Pages deployment -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-color: #030303;
            --accent-gold: #d4af37;
            --text-main: #f5f5f5;
            --border-glass: rgba(212, 175, 55, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Ambient HUD Overlay */
        .hud-header {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-title {
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin: 0;
            color: #ffffff;
            font-weight: 300;
        }

        .hud-subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Spatial Drawer Panel for Monograph & Details */
        .node-drawer {
            position: absolute;
            right: -450px;
            top: 0;
            width: 400px;
            height: 100%;
            background: rgba(8, 8, 8, 0.92);
            backdrop-filter: blur(25px);
            border-left: 1px solid var(--border-glass);
            z-index: 100;
            box-sizing: border-box;
            padding: 50px 40px;
            transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .node-drawer.active {
            right: 0;
        }

        .drawer-close {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .drawer-close:hover { color: var(--accent-gold); }

        .drawer-tag {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .drawer-title {
            font-size: 1.8rem;
            font-weight: 300;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .drawer-body {
            font-size: 0.88rem;
            line-height: 1.9;
            color: #bbb;
            font-weight: 300;
        }

        .instructions-hint {
            position: absolute;
            bottom: 30px;
            left: 40px;
            z-index: 10;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: #666;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1 class="hud-title">Hesham Malik</h1>
        <div class="hud-subtitle">Sovereign Codex &bull; Interactive Node Engine</div>
    </div>

    <div class="instructions-hint">
        &bull; Drag to rotate spatial field | Scroll to zoom | Click node to enter monograph
    </div>

    <div id="webgl-container"></div>

    <!-- Interactive Drawer Panel -->
    <div class="node-drawer" id="nodeDrawer">
        <button class="drawer-close" onclick="closeDrawer()">&times;</button>
        <div class="drawer-tag" id="drawerTag">PILLAR ARCHIVE</div>
        <h2 class="drawer-title" id="drawerTitle">Node Title</h2>
        <div class="drawer-body" id="drawerBody">Detailed archival description...</div>
    </div>

    <script>
        // Data Registry for Nodes
        const nodesData = [
            {
                id: "words",
                title: "Words",
                tag: "PILLAR I &bull; GLOBAL ARCHIVE",
                type: "pillar",
                color: 0xd4af37,
                pos: { x: -30, y: 0, z: 0 },
                description: "Global Project Words gathers thousands of single, spontaneous word contributions from world leaders, scientists, environmentalists, and cultural figures across global networks of governance and heritage."
            },
            {
                id: "box",
                title: "Life of a Box",
                tag: "PILLAR II &bull; ECOLOGICAL SCULPTURE",
                type: "pillar",
                color: 0xd4af37,
                pos: { x: 30, y: 0, z: 0 },
                description: "A monumental sustainability endeavor transforming used industrial cardboard packaging into structural high-art sculptures, supported by international environmental networks."
            },
            {
                id: "voices",
                title: "Voices of the Land",
                tag: "PILLAR III &bull; SACRED INDIGENOUS KNOWLEDGE",
                type: "pillar",
                color: 0xd4af37,
                pos: { x: 0, y: 30, z: -20 },
                description: "A reverent collaboration preserving sacred indigenous concepts—such as Ankosé ('everything is connected') and sâkihitowin ('love as foundational wellness')—into permanent visual monuments."
            },
            {
                id: "rooh",
                title: "Rooh-Nawaz",
                tag: "PILLAR IV &bull; HUMAN RESILIENCE",
                type: "pillar",
                color: 0xd4af37,
                pos: { x: 0, y: -30, z: 20 },
                description: "An extensive visual testimonial honoring the global Persian community, exploring central concepts like Adab (ethical reverence) and Bi-gharāri (dynamic seeking)."
            }
        ];

        // Scene Setup
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030303, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 90);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        // Ambient Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xd4af37, 2, 100);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // Render Nodes
        const nodeMeshes = [];
        const sphereGeo = new THREE.SphereGeometry(4, 32, 32);

        nodesData.forEach(data => {
            const mat = new THREE.MeshStandardMaterial({
                color: data.color,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0xd4af37,
                emissiveIntensity: 0.3
            });

            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.position.set(data.pos.x, data.pos.y, data.pos.z);
            mesh.userData = data;
            scene.add(mesh);
            nodeMeshes.push(mesh);
        });

        // Connecting Lines Engine
        const lineMat = new THREE.LineBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.2 });
        for (let i = 0; i < nodeMeshes.length; i++) {
            for (let j = i + 1; j < nodeMeshes.length; j++) {
                const geo = new THREE.BufferGeometry().setFromPoints([
                    nodeMeshes[i].position,
                    nodeMeshes[j].position
                ]);
                const line = new THREE.Line(geo, lineMat);
                scene.add(line);
            }
        }

        // Raycasting for Interactivity
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);

            if (intersects.length > 0) {
                const node = intersects[0].object.userData;
                openDrawer(node);
            }
        });

        function openDrawer(data) {
            document.getElementById('drawerTag').innerHTML = data.tag;
            document.getElementById('drawerTitle').innerText = data.title;
            document.getElementById('drawerBody').innerHTML = data.description;
            document.getElementById('nodeDrawer').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('nodeDrawer').classList.remove('active');
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Subtle rotation of entire spatial cluster
            nodeMeshes.forEach(mesh => {
                mesh.rotation.y += 0.005;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
