<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesham Malik | Sovereign Spatial Codex</title>

    <!-- Primary Metadata -->
    <meta name="description" content="Official Sovereign Spatial Codex of Hesham Malik. Three decades of fine art, global participatory archives, ecological installations, and academic research.">
    <meta name="keywords" content="Hesham Malik, Fine Art, Sovereign Archive, Global Project Words, Life of a Box, Voices of the Land, Rooh-Nawaz, Contemporary Art Archive">
    <meta name="author" content="Hesham Malik">
    <link rel="canonical" href="https://heshammalik.org/">

    <!-- Open Graph Protocol -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hesham Malik Sovereign Archive">
    <meta property="og:title" content="Hesham Malik | Sovereign Spatial Codex">
    <meta property="og:description" content="Three Decades of Sovereign Art, Global Institutional Archives, and Planetary Initiatives.">
    <meta property="og:url" content="https://heshammalik.org/">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Hesham Malik | Sovereign Spatial Codex">
    <meta name="twitter:description" content="Three Decades of Sovereign Art & Global Institutional Archives.">

    <!-- Three.js & OrbitControls via CDN for zero-build GitHub Pages deployment -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://heshammalik.org/#artist",
          "name": "Hesham Malik",
          "jobTitle": "Visual Artist & Cultural Researcher",
          "url": "https://heshammalik.org",
          "sameAs": [
            "https://heshammalik.eu",
            "https://heshammalik.com"
          ],
          "knowsAbout": [
            "Abstract Fine Art",
            "Participatory Art Archives",
            "Ecological Sustainability Initiatives",
            "Indigenous Cultural Heritage",
            "Persian Diaspora Literature"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://heshammalik.org/#website",
          "url": "https://heshammalik.org",
          "name": "Hesham Malik Sovereign Spatial Codex",
          "description": "Primary digital archive and monographic record documenting three decades of Hesham Malik's global fine art trajectory.",
          "publisher": {
            "@id": "https://heshammalik.org/#artist"
          },
          "inLanguage": "en"
        }
      ]
    }
    </script>

    <style>
        :root {
            --bg-color: #030303;
            --accent-gold: #d4af37;
            --text-main: #f5f5f5;
            --border-glass: rgba(212, 175, 55, 0.25);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Ambient Head-Up Display (HUD) Overlay */
        .hud-header {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-title {
            font-size: 1.3rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin: 0;
            color: #ffffff;
            font-weight: 300;
        }

        .hud-subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* Spatial Monograph Drawer Panel */
        .node-drawer {
            position: absolute;
            right: -480px;
            top: 0;
            width: 440px;
            height: 100%;
            background: rgba(8, 8, 8, 0.94);
            backdrop-filter: blur(25px);
            border-left: 1px solid var(--border-glass);
            z-index: 100;
            box-sizing: border-box;
            padding: 50px 40px;
            transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .node-drawer.active {
            right: 0;
        }

        .drawer-close {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            color: #888888;
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
            padding: 5px;
        }

        .drawer-close:hover { color: var(--accent-gold); }

        .drawer-tag {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: var(--accent-gold);
            text-transform: uppercase;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .drawer-title {
            font-size: 1.8rem;
            font-weight: 300;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffffff;
        }

        .drawer-body {
            font-size: 0.88rem;
            line-height: 1.9;
            color: #cccccc;
            font-weight: 300;
        }

        .drawer-body b, .drawer-body strong {
            color: #ffffff;
        }

        .instructions-hint {
            position: absolute;
            bottom: 30px;
            left: 40px;
            z-index: 10;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: #666666;
            text-transform: uppercase;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .hud-header { top: 20px; left: 20px; }
            .hud-title { font-size: 1rem; }
            .instructions-hint { left: 20px; bottom: 20px; font-size: 0.55rem; }
            .node-drawer { width: 100%; right: -100%; padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <h1 class="hud-title">Hesham Malik</h1>
        <div class="hud-subtitle">Sovereign Spatial Codex &bull; Three Decades of Fine Art</div>
    </div>

    <div class="instructions-hint">
        &bull; Drag to rotate spatial field | Scroll to zoom | Click any node to open monograph
    </div>

    <div id="webgl-container"></div>

    <!-- Interactive Monograph Drawer Panel -->
    <div class="node-drawer" id="nodeDrawer">
        <button class="drawer-close" onclick="closeDrawer()">&times;</button>
        <div class="drawer-tag" id="drawerTag">PILLAR ARCHIVE</div>
        <h2 class="drawer-title" id="drawerTitle">Node Title</h2>
        <div class="drawer-body" id="drawerBody">Detailed archival description...</div>
    </div>

    <script>
        // Master Data Registry: Core Pillars & Institutional Orbit Nodes
        const nodesData = [
            // --- CORE PILLARS ---
            {
                id: "words",
                title: "Words",
                tag: "PILLAR I &bull; GLOBAL PARTICIPATORY ARCHIVE",
                type: "pillar",
                color: 0xd4af37,
                pos: { x: -35, y: 10, z: 0 },
                description: "<b>Global Project Words</b> gathers thousands of single, spontaneous word contributions from world leaders, Nobel laureates, scientists, environmentalists, and cultural figures. These donated terms serve as raw conceptual energy translated into monumental abstract canvases mapping human sentiment and global crisis."
            },
            {
                id: "box",
                title: "Life of a Box",
                tag: "PILLAR II &bull; GLOBAL SUSTAINABILITY INITIATIVE",
                type: "pillar",
                color: 0xd4af37,
                pos: { x: 35, y: 10, z: 0 },
                description: "A flagship global sustainability initiative transforming discarded industrial cardboard packaging into structural high-art sculptures. Supported by environmental networks, state museums, and global institutions including the Nobel Prize Museum, UNICEF, Red Cross, and Amazon UK, it proves that everyday material holds profound aesthetic longevity."
            },
            {
                id: "voices",
                title: "Voices of the Land",
                tag: "PILLAR III &bull; SACRED INDIGENOUS KNOWLEDGE",
                type: "pillar",
                color: 0xd4af37,
                pos: { x: 0, y: 35, z: -25 },
                description: "A reverent collaboration preserving sacred indigenous concepts—such as Ojibwemowin <i>Ankosé</i> ('everything is connected') and Cree <i>sâkihitowin</i> ('love as bedrock wellness')—elevating living languages into permanent visual monuments in dialogue with elders and scholars."
            },
            {
                id: "rooh",
                title: "روح‌نواز (Rooh-Nawaz)",
                tag: "PILLAR IV &bull; TESTIMONIES OF HUMAN RESILIENCE",
                type: "pillar",
                color: 0xd4af37,
                pos: { x: 0, y: -35, z: 25 },
                description: "An extensive visual testimonial honoring the global Persian community. Anchored in concepts like <i>Adab</i> (ethical reverence) and <i>Bi-gharāri</i> (the rejection of intellectual stagnation), it transforms memory, exile, and displacement into monumental visual expressions."
            },

            // --- INSTITUTIONAL ORBIT NODES ---
            {
                id: "harvard",
                title: "Harvard Network",
                tag: "INSTITUTIONAL ORBIT &bull; WORDS PROJECT",
                type: "orbit",
                color: 0x888888,
                pos: { x: -55, y: 25, z: 15 },
                description: "Over 100 single-word contributions donated across Harvard's academic spectrum—including department deans, senior faculty, and scholars. Donated terms include: <i>decency, disruption, xenophilia, cognition, enlightenment, serenity,</i> and <i>persisting</i>."
            },
            {
                id: "nobel",
                title: "Nobel Prize Museum",
                tag: "SUSTAINABILITY PARTNER &bull; LIFE OF A BOX",
                type: "orbit",
                color: 0x888888,
                pos: { x: 55, y: 25, z: -15 },
                description: "<i>'The Nobel Prize Museum believes that the future is still open and ours to shape through critical thinking, creativity and persistence.'</i> Participating institutional partner supporting global ecological material transformation."
            },
            {
                id: "unicef",
                title: "UNICEF & Red Cross",
                tag: "GLOBAL ADVOCACY &bull; SUSTAINABILITY",
                type: "orbit",
                color: 0x888888,
                pos: { x: 48, y: -22, z: 20 },
                description: "Engaging in sustainable behavior change and climate-friendly action. Partner institutions supplying industrial packaging materials and formal statements on intergenerational environmental responsibility."
            },
            {
                id: "oxbridge",
                title: "Oxford & Cambridge",
                tag: "ACADEMIC CITATION &bull; WORDS PROJECT",
                type: "orbit",
                color: 0x888888,
                pos: { x: -48, y: -22, z: -20 },
                description: "Foundational word donations from leading faculties: Prof. David Lane (University of Cambridge) contributed <b>'love'</b>, and Prof. Kate Raworth (University of Oxford, <i>Doughnut Economics</i>) offered <b>'play'</b> as the bedrock for systemic human creativity."
            },
            {
                id: "ngc",
                title: "National Gallery of Canada",
                tag: "INDIGENOUS HERITAGE &bull; VOICES OF THE LAND",
                type: "orbit",
                color: 0x888888,
                pos: { x: -22, y: 55, z: -35 },
                description: "Donated the Anishinaabemowin concept <b>'Ankosé'</b> ('everything is connected'), guiding relational vision and territorial interconnectedness."
            },
            {
                id: "scholars",
                title: "Scholarly Faculties",
                tag: "ACADEMIC DIALOGUE &bull; ROOH-NAWAZ",
                type: "orbit",
                color: 0x888888,
                pos: { x: 22, y: -55, z: 35 },
                description: "Collaborative academic synthesis featuring scholars from Columbia, Harvard, Yale, Courtauld Institute, Göttingen, and UC Irvine exploring <i>Adab</i>, <i>Jān</i>, and non-dualistic oneness."
            }
        ];

        // Scene Setup Engine
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030303, 0.006);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 115);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        // Lighting Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const coreLight = new THREE.PointLight(0xd4af37, 2.5, 120);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);

        // Geometries & Mesh Creation
        const pillarGeo = new THREE.SphereGeometry(4.5, 32, 32);
        const orbitGeo = new THREE.SphereGeometry(2.2, 24, 24);

        const nodeMeshes = [];

        nodesData.forEach(data => {
            const isPillar = data.type === "pillar";
            const mesh = new THREE.Mesh(
                isPillar ? pillarGeo : orbitGeo,
                new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: isPillar ? 0.2 : 0.5,
                    metalness: isPillar ? 0.8 : 0.3,
                    emissive: data.color,
                    emissiveIntensity: isPillar ? 0.4 : 0.15
                })
            );

            mesh.position.set(data.pos.x, data.pos.y, data.pos.z);
            mesh.userData = data;
            scene.add(mesh);
            nodeMeshes.push(mesh);
        });

        // Network Constellation Lines
        const lineMat = new THREE.LineBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.18 });
        for (let i = 0; i < nodeMeshes.length; i++) {
            for (let j = i + 1; j < nodeMeshes.length; j++) {
                const dist = nodeMeshes[i].position.distanceTo(nodeMeshes[j].position);
                if (dist < 70) {
                    const geo = new THREE.BufferGeometry().setFromPoints([
                        nodeMeshes[i].position,
                        nodeMeshes[j].position
                    ]);
                    scene.add(new THREE.Line(geo, lineMat));
                }
            }
        }

        // Raycaster for Mouse Interactivity
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodeMeshes);

            if (intersects.length > 0) {
                const node = intersects[0].object.userData;
                openDrawer(node);
            }
        });

        function openDrawer(data) {
            document.getElementById('drawerTag').innerHTML = data.tag;
            document.getElementById('drawerTitle').innerText = data.title;
            document.getElementById('drawerBody').innerHTML = data.description;
            document.getElementById('nodeDrawer').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('nodeDrawer').classList.remove('active');
        }

        // Continuous Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            nodeMeshes.forEach(mesh => {
                mesh.rotation.y += 0.004;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
